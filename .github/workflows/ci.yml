name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: >-
          xcodebuild test
          -scheme PasteQueue
          -destination 'platform=macOS,arch=arm64'
          -only-testing:PasteQueueTests
          -derivedDataPath /tmp/PasteQueueDerivedData
          CODE_SIGNING_ALLOWED=NO

      - name: Compile Release configuration
        run: >-
          xcodebuild
          -scheme PasteQueue
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath /tmp/PasteQueueReleaseDerivedData
          CODE_SIGNING_ALLOWED=NO
          build
