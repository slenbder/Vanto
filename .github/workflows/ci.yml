name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated project is committed
        run: git diff --exit-code -- Vanto.xcodeproj Vanto/Info.plist

      - name: Run unit tests
        run: >-
          xcodebuild test
          -scheme Vanto
          -destination 'platform=macOS,arch=arm64'
          -only-testing:VantoTests
          -derivedDataPath /tmp/VantoDerivedData
          CODE_SIGNING_ALLOWED=NO

      - name: Compile Release configuration
        run: >-
          xcodebuild
          -scheme Vanto
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath /tmp/VantoReleaseDerivedData
          CODE_SIGNING_ALLOWED=NO
          build

  site:
    name: Site build is current
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Site/ is generated from site-src/ and committed, because Cloudflare
      # Pages deploys it with no build step. A stale or hand-edited page fails here.
      - name: Rebuild the site
        run: node scripts/build-site.mjs

      - name: Verify generated site is committed
        run: |
          git status --porcelain -- Site
          test -z "$(git status --porcelain -- Site)"
