name: PasteQueue
options:
  bundleIdPrefix: com.slenbder
  deploymentTarget:
    macOS: "13.0"
targets:
  PasteQueue:
    type: application
    platform: macOS
    sources:
      - path: PasteQueue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slenbder.pastequeue
        DEVELOPMENT_TEAM: 6D5U6N6YZA
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSUIElement: true
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: PasteQueueIcon
  PasteQueueTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PasteQueueTests
    dependencies:
      - target: PasteQueue
    settings:
      base:
        DEVELOPMENT_TEAM: 6D5U6N6YZA
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PasteQueue.app/Contents/MacOS/PasteQueue"
schemes:
  PasteQueue:
    build:
      targets:
        PasteQueue: all
        PasteQueueTests: [test]
    test:
      targets:
        - PasteQueueTests
      config: Debug
    run:
      config: Debug
    archive:
      config: Release
